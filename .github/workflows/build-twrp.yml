name: Build TWRP for Xiaomi 15 (sm8750 / dada)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Maximize disk space
        run: |
          set -x
          df -h /
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                       /opt/hostedtoolcache/go /opt/hostedtoolcache/node \
                       /usr/local/share/boost /usr/local/lib/node_modules \
                       /usr/share/swift /opt/azure /opt/google/chrome || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y git-core gnupg flex bison build-essential zip \
              curl zlib1g-dev libncurses5-dev libxml2-utils xsltproc \
              unzip fontconfig rsync lz4 libssl-dev ccache

      - name: Install repo tool
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Setup swap space (soong analysis needs >16GB RAM)
        run: |
          set -x
          free -h
          # AOSP-16 soong analysis peaks at 20-30GB RAM; runner has 15.6GB.
          # Create a 24GB swapfile on the 60GB+ free disk to survive it.
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Sync TWRP twrp-16.0 source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init \
              -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp \
              -b twrp-16.0 --depth=1
          git clone --depth=1 https://github.com/YuKongA/twrp_device_xiaomi_sm8750_thales -b twrp-16.0 device/xiaomi/sm8750_thales
          repo sync -c --no-clone-bundle --no-tags -j8 --fail-fast
          df -h ~/twrp

      - name: Pin classic TWRP UI (pre-GUI2 sources)
        run: |
          set -e
          # GUI2 (bootable/recovery dbcad759, 2026-10-24) removed the classic theme
          # (gui/theme -> /twres) and made the 2026-11-06 build crash at init and
          # loop-reboot on sm8750. Pin to the classic state used by YuKongA's
          # known-booting 2026-08-11 release (commit from 2026-08-07).
          #
          # NOTE: repo-synced projects do NOT have a remote named "origin"
          # (repo names remotes after the manifest remote, e.g. twrp-16.0), so
          # fetch by explicit URL + SHA instead.
          pin_commit() {
            local dir="$1" url="$2" sha="$3"
            cd "$dir"
            echo "== pin $(basename "$dir") -> $sha =="
            git fetch --depth=1 "$url" "$sha"
            git -c advice.detachedHead=false checkout --detach "$sha" \
              || git -c advice.detachedHead=false checkout --detach FETCH_HEAD
            git log -1 --oneline
          }

          pin_commit ~/twrp/bootable/recovery \
            https://github.com/TWRP-Test/android_bootable_recovery \
            0f87bccfd011a043f60a883e7e526c4cc9ed67c2
          test -d ~/twrp/bootable/recovery/gui/theme/common \
            || { echo "FATAL: classic theme sources missing"; exit 1; }

          # vendor/twrp was at this commit when the 2026-08-11 official image was built;
          # later commits (Oct) export GUI2-only Soong config and mismatch classic recovery.
          pin_commit ~/twrp/vendor/twrp \
            https://github.com/TWRP-Test/android_vendor_twrp \
            f5b908030195b41271ff39f1c707bb716271c478

          # Classic recovery/Android.mk guards on external/magisk-prebuilt/Android.mk
          # (empty marker file); newer magisk-prebuilt dropped it for Android.bp only.
          # Pin to the version used by the 2026-08-11 official build.
          pin_commit ~/twrp/external/magisk-prebuilt \
            https://github.com/TWRP-Test/external_magisk-prebuilt \
            1e91763f0e216c2a674d018811967e0837b27e0e
          test -f ~/twrp/external/magisk-prebuilt/Android.mk \
            || { echo "FATAL: magisk-prebuilt Android.mk marker missing"; exit 1; }

      - name: Patch device tree (crashrecovery APEX classpath jars)
        run: |
          cd ~/twrp/device/xiaomi/sm8750_thales
          # Register crashrecovery APEX jars in the AOSP android-16 <apex>:<jar> format.
          # The module_sdk snapshot ships prebuilt_systemserverclasspath-fragment with
          # contents: [service-crashrecovery]; soong requires it to be declared here.
          if ! grep -q "com.android.crashrecovery:service-crashrecovery" device.mk; then
            cat >> device.mk <<'FIXEOF'

          # Fix: crashrecovery APEX classpath jars (format <apex>:<jar>, see
          # build/make/target/product/default_art_config.mk in AOSP android-16)
          PRODUCT_APEX_SYSTEM_SERVER_JARS += com.android.crashrecovery:service-crashrecovery
          PRODUCT_APEX_BOOT_JARS += com.android.crashrecovery:framework-crashrecovery
          FIXEOF
          fi
          tail -8 device.mk

      - name: Reclaim disk from git objects
        run: |
          cd ~/twrp
          echo "=== before ==="; df -h /
          find .repo/project-objects -type f -name "*.pack" -delete 2>/dev/null || true
          find .repo/project-objects -type f -name "*.idx" -delete 2>/dev/null || true
          find .repo/projects -type f -name "*.pack" -delete 2>/dev/null || true
          find .repo/projects -type f -name "*.idx" -delete 2>/dev/null || true
          echo "=== after ==="; df -h /

      - name: Build recovery image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="$HOME/.local/bin:$PATH"
          # Reduce parallelism: 2 cores/15.6GB runner cannot feed -j$(nproc) anyway
          # during soong/kati; memory pressure was killing the job.
          source build/envsetup.sh
          lunch twrp_sm8750_thales-bp2a-userdebug \
            || lunch twrp_sm8750_thales-ap2a-userdebug \
            || lunch twrp_sm8750_thales-userdebug \
            || lunch twrp_sm8750_thales-eng
          mka recoveryimage -j3

      - name: Verify classic UI ramdisk (twres must exist)
        run: |
          cd ~/twrp
          set -e
          TW=$(find out/target/product -maxdepth 5 -type d -name twres 2>/dev/null | head -1)
          echo "twres dir: [$TW]"
          if [ -z "$TW" ]; then
            echo "FATAL: classic theme (twres) missing from recovery staging"
            find out/target/product -maxdepth 4 -type d -name root | head -5 || true
            exit 1
          fi
          echo "twres entries: $(ls "$TW" | wc -l)"
          # GUI2 libs must not be in the image (they only appear with the new UI)
          if find out/target/product -maxdepth 6 -name 'liblvgl_twrp.so' 2>/dev/null | grep -q .; then
            echo "FATAL: GUI2 liblvgl_twrp.so found - classic pin failed"
            exit 1
          fi
          echo "classic UI verification passed"

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-sm8750-thales-recovery
          path: |
            /home/runner/twrp/out/target/product/*/recovery.img
            /home/runner/twrp/out/target/product/*/*recovery*.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-build-logs
          path: |
            /home/runner/twrp/out/soong.log
            /home/runner/twrp/out/verbose.log
            /home/runner/twrp/out/error.log
          if-no-files-found: ignore
          retention-days: 14
