name: Build TWRP for Xiaomi 15 (sm8750 / dada)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free disk space
        run: |
          set -e
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                       /usr/local/share/boost /usr/local/lib/node_modules || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y git-core gnupg flex bison build-essential zip \
              curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
              libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
              unzip fontconfig rsync lz4 libssl-dev ccache

      - name: Install repo tool
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync TWRP twrp-16.0 source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init \
              -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp \
              -b twrp-16.0 --depth=1
          git clone --depth=1 https://github.com/YuKongA/twrp_device_xiaomi_sm8750_thales -b twrp-16.0 device/xiaomi/sm8750_thales
          repo sync -c --no-clone-bundle --no-tags -j8 --fail-fast
          df -h ~/twrp

      - name: Build recovery image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="$HOME/.local/bin:$PATH"
          source build/envsetup.sh
          lunch twrp_sm8750_thales-userdebug \
            || lunch twrp_sm8750_thales-ap2a-userdebug \
            || lunch twrp_sm8750_thales-eng
          mka recoveryimage -j"$(nproc)"

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-sm8750-thales-recovery
          path: |
            /home/runner/twrp/out/target/product/*/recovery.img
            /home/runner/twrp/out/target/product/*/*recovery*.img
          if-no-files-found: error
          retention-days: 14

      - name: Show build summary
        if: always()
        run: |
          ls -lh ~/twrp/out/target/product/*/recovery.img 2>/dev/null || true
          echo "---- 若失败, 上传 Build 日志 ----"
